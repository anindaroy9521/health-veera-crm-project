name: Python CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show Black Version
        run: black --version

      - name: Check Formatting
        run: black --check lambda glue_jobs

      - name: Check Imports
        run: isort lambda glue_jobs --check-only

      - name: Lint
        run: flake8 lambda glue_jobs

      - name: Run Tests
        run: pytest || echo "No tests yet"

      - name: Generate Coverage
        run: pytest --cov=. --cov-report=xml || true

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
